name: Android Release Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0"
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36.1.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/bootloaderstudio-release.jks

      - name: Build release APKs (per-ABI + universal)
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/keystore/bootloaderstudio-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signatures
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | sed -n '1,4p'
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: bootloaderstudio-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
